name: MJON recovery artifact diagnostics

on:
  push:
    branches: [recovery/mjon-ai-os-stability-20261105]
    paths: ['.github/workflows/mjon-artifact-diagnostics.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Same-repository source workflow run ID
        required: true
        type: string
      artifact_name:
        description: Exact diagnostic artifact name
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Read existing diagnostic records without executing artifact contents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the exact source diagnostics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || '42217951377' }}
          name: ${{ inputs.artifact_name || 'mjon-ai-os-iso-build-diagnostics-42217951377' }}
          path: ${{ runner.temp }}/mjon-source-diagnostics
      - name: Print bounded existing verification records
        env:
          MJON_DIAGNOSTIC_ROOT: ${{ runner.temp }}/mjon-source-diagnostics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["MJON_DIAGNOSTIC_ROOT"])
          allowed = {"boot-bios-serial.txt", "boot-uefi-serial.txt",
                     "mjon-build.json", "offline-provider-evidence.json"}
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name in allowed:
                  print("\nMJON_DIAGNOSTIC_FILE " + path.name, flush=True)
                  print(path.read_text(errors="replace")[-60000:], flush=True)
          for path in root.rglob("mjon-build.log"):
              lines = [line for line in path.read_text(errors="replace").splitlines()
                       if re.search("squashfs|mksquashfs|compression", line, re.I)]
              print("\nMJON_COMPRESSION_LOG_EXCERPT", flush=True)
              print("\n".join(lines[-35:]), flush=True)
          PY

  ownership:
    name: Reproduce root-owned payload as an unprivileged provider
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the recovery experiment
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          persist-credentials: false
      - name: Download the exact quarantined image for read-only extraction
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '42217951377'
          name: mjon-ai-os-UNVERIFIED-image-8f156309daaf00263025569e7632e81a513e577e
          path: ${{ runner.temp }}/mjon-owner-image
      - name: Extract the reviewed payload without booting or installing the image
        env:
          MJON_OWNER_TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xorriso squashfs-tools
          cd "$MJON_OWNER_TMP/mjon-owner-image"
          sha256sum -c MJON-AI-OS-dev-amd64.iso.sha256
          xorriso -osirrox on -indev MJON-AI-OS-dev-amd64.iso \
            -extract /live/filesystem.squashfs "$MJON_OWNER_TMP/mjon-owner.squashfs" > "$MJON_OWNER_TMP/mjon-owner-extract.log" 2>&1
          rm MJON-AI-OS-dev-amd64.iso
          unsquashfs -no-progress -d "$MJON_OWNER_TMP/mjon-owner-root" \
            "$MJON_OWNER_TMP/mjon-owner.squashfs" opt/mjon-ai-os/ollama
          rm "$MJON_OWNER_TMP/mjon-owner.squashfs"
          sudo chown -R root:root "$MJON_OWNER_TMP/mjon-owner-root/opt/mjon-ai-os/ollama"
          sudo useradd --create-home --shell /usr/sbin/nologin mjonprobe
          python3 -m venv "$MJON_OWNER_TMP/mjon-owner-venv"
          "$MJON_OWNER_TMP/mjon-owner-venv/bin/python" -m pip install --disable-pip-version-check \
            openai==3.46.0 httpx pydantic-settings structlog loguru keyring psutil pyyaml tomlkit aiosqlite \
            > "$MJON_OWNER_TMP/mjon-owner-pip.log" 2>&1
          cd "$GITHUB_WORKSPACE"
          "$MJON_OWNER_TMP/mjon-owner-venv/bin/python" -m pip install --no-deps -e . \
            >> "$MJON_OWNER_TMP/mjon-owner-pip.log" 2>&1
      - name: Exercise ownership failure and a prebaked profile without external networking
        env:
          MJON_OWNER_TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p "$MJON_OWNER_TMP/mjon-owner-results"
          sudo unshare --net -- "$MJON_OWNER_TMP/mjon-owner-venv/bin/python" \
            scripts/mjon_root_owned_acceptance.py \
            --payload "$MJON_OWNER_TMP/mjon-owner-root/opt/mjon-ai-os/ollama" \
            --output-dir "$MJON_OWNER_TMP/mjon-owner-results" --probe-user mjonprobe
      - name: Retain actual ownership experiment records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mjon-ownership-proof-${{ github.sha }}
          path: ${{ runner.temp }}/mjon-owner-results
          if-no-files-found: ignore
          retention-days: 7
