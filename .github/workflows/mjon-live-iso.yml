# Experimental ISO builder. Runs only when this workflow changes or is explicitly dispatched.
# Unified AI fabric v1: opt-in module catalog, local-only Ollama adapter,
# GTK Control Center (with KDE fallback), conservative zram/AppArmor baseline,
# and explicit ISO-chroot import checks. NO optional engines auto-installed.
# Hardware fix: Realtek RTL8822CE loads firmware, but no Wi-Fi backend when
# wpasupplicant is omitted because APT recommends are disabled. The package
# list now explicitly bundles wpasupplicant, rfkill and KDE's network applet.
# Hardware USB regression: installed JARVIS was stuck in "Starting..." due to
# omitted dodaios.verse_host.relays package. The build now imports the actual
# Verse host and relays in the Debian chroot; a missing module fails the ISO.
# It never installs the OS on a real computer. A validated push explicitly
# labeled release(os) publishes a downloadable experimental Live USB prerelease.
# Build attempt 1 proved a binary-only pip restriction rejected Vosk/srt;
# this build uses the reviewed native hook with desktop extras and source fallback.
name: MJON AI OS - experimental USB ISO

on:
  push:
    branches: [feature/mjon-ai-os-native]
    paths:
      - '.github/workflows/mjon-live-iso.yml'
  workflow_dispatch:

# Keep a single high-resource image build per development branch.
concurrency:
  group: mjon-live-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-iso:
    name: Build and inspect Debian 13 live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - name: Checkout the single MJON monorepo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          persist-credentials: false
      - name: Free space on disposable GitHub runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell
          df -h /
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dodaios/ui/web/frontend/package-lock.json
      - name: Build complete native desktop interface
        working-directory: dodaios/ui/web/frontend
        run: |
          npm ci
          npm run build
      - name: Run image and first-boot contracts
        run: |
          python -m unittest discover -s mjon_os/tests -p 'test_*.py' -v
          sh -n mjon_os/live/config/includes.chroot/usr/local/bin/mjon-vm-proof
          sh -n mjon_os/live/config/includes.chroot/usr/local/bin/mjon-control-center
      - name: Build the modified Dodaios engine wheel
        run: |
          python -m pip install --disable-pip-version-check 'setuptools>=84.1.0' wheel build
          python -m build --wheel --no-isolation -o "$RUNNER_TEMP/wheels"
      - name: Create native live-build tree
        env:
          MJON_CI_TMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from mjon_os.image_builder import prepare_image
          root=Path(os.environ['MJON_CI_TMP'])
          wheels=list((root/'wheels').glob('dodaios-*.whl'))
          if len(wheels)!=1:
              raise SystemExit(f'Expected one local fork wheel: {wheels}')
          result=prepare_image(repo_root=Path.cwd(), wheel=wheels[0], destination=root/'mjon-live')
          print(result)
          PY
      - name: Assemble Debian ISO in disposable privileged builder
        env:
          MJON_CI_TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$MJON_CI_TMP/mjon-live:/work" -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap ca-certificates xorriso squashfs-tools \
                syslinux isolinux grub-pc-bin grub-efi-amd64-bin dosfstools
              lb config
              lb build > /work/mjon-build.log 2>&1 || {
                tail -n 180 /work/mjon-build.log >&2
                exit 1
              }
              ls -lh /work/*.iso
            '
      - name: Check BIOS and UEFI boot structure
        env:
          MJON_CI_TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xorriso
          mapfile -t images < <(find "$MJON_CI_TMP/mjon-live" -maxdepth 1 -name '*.iso' -type f)
          test "${#images[@]}" -eq 1
          iso="${images[0]}"
          test "$(stat -c '%s' "$iso")" -gt 100000000
          xorriso -indev "$iso" -report_el_torito plain > "$MJON_CI_TMP/mjon-live/boot-records.txt" 2>&1
          cat "$MJON_CI_TMP/mjon-live/boot-records.txt"
          grep -Eqi 'BIOS|El Torito boot img' "$MJON_CI_TMP/mjon-live/boot-records.txt"
          grep -Eqi 'UEFI|EFI' "$MJON_CI_TMP/mjon-live/boot-records.txt"
          sha256sum "$iso" > "$iso.sha256"
          mv "$iso" "$MJON_CI_TMP/mjon-live/MJON-AI-OS-dev-amd64.iso"
          mv "$iso.sha256" "$MJON_CI_TMP/mjon-live/MJON-AI-OS-dev-amd64.iso.sha256"
          # Update checksum to use the final filename, not its previous staging name.
          ( cd "$MJON_CI_TMP/mjon-live" && sha256sum MJON-AI-OS-dev-amd64.iso > MJON-AI-OS-dev-amd64.iso.sha256 )
      - name: Boot the ISO in isolated BIOS and UEFI virtual machines
        env:
          MJON_CI_TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf
          iso="$MJON_CI_TMP/mjon-live/MJON-AI-OS-dev-amd64.iso"
          python -m mjon_os.qemu_boot --iso "$iso" --timeout 420 \
            --log "$MJON_CI_TMP/mjon-live/boot-bios-serial.txt"
          python -m mjon_os.qemu_boot --iso "$iso" \
            --uefi-firmware /usr/share/OVMF/OVMF_CODE_4M.fd --timeout 420 \
            --log "$MJON_CI_TMP/mjon-live/boot-uefi-serial.txt"
          # Hardware exposed a broken Live login: the greeter alone is not enough.
          # The replacement guest proof must exercise user/live PAM authentication.
          grep -Fq 'MJON_VM_PROOF DISPLAY_MANAGER_ACTIVE' "$MJON_CI_TMP/mjon-live/boot-bios-serial.txt"
          grep -Fq 'MJON_VM_PROOF DISPLAY_MANAGER_ACTIVE' "$MJON_CI_TMP/mjon-live/boot-uefi-serial.txt"
          # Actual hardware revealed that SDDM can run before a usable live user
          # exists. Never mark ISO boot verified without account and password.
          grep -Fq 'MJON_VM_PROOF LIVE_USER_READY' "$MJON_CI_TMP/mjon-live/boot-bios-serial.txt"
          grep -Fq 'MJON_VM_PROOF LIVE_USER_READY' "$MJON_CI_TMP/mjon-live/boot-uefi-serial.txt"
          # Genuine Windows-style graphical Control Center in both guest boots.
          grep -Fq 'MJON_VM_PROOF CONTROL_CENTER_READY' "$MJON_CI_TMP/mjon-live/boot-bios-serial.txt"
          grep -Fq 'MJON_VM_PROOF CONTROL_CENTER_READY' "$MJON_CI_TMP/mjon-live/boot-uefi-serial.txt"
          grep -Fq 'MJON_VM_PROOF PLASMA_DESKTOP_ACTIVE' "$MJON_CI_TMP/mjon-live/boot-bios-serial.txt"
          grep -Fq 'MJON_VM_PROOF PLASMA_DESKTOP_ACTIVE' "$MJON_CI_TMP/mjon-live/boot-uefi-serial.txt"
          grep -Fq 'MJON_VM_PROOF JARVIS_SERVICE_STABLE' "$MJON_CI_TMP/mjon-live/boot-bios-serial.txt"
          grep -Fq 'MJON_VM_PROOF JARVIS_SERVICE_STABLE' "$MJON_CI_TMP/mjon-live/boot-uefi-serial.txt"
          grep -Fq 'MJON_VM_PROOF JARVIS_API_READY' "$MJON_CI_TMP/mjon-live/boot-bios-serial.txt"
          grep -Fq 'MJON_VM_PROOF JARVIS_API_READY' "$MJON_CI_TMP/mjon-live/boot-uefi-serial.txt"
      - name: Upload experimental ISO for virtual-machine testing (not release)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mjon-ai-os-developer-iso-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mjon-live/MJON-AI-OS-dev-amd64.iso
            ${{ runner.temp }}/mjon-live/MJON-AI-OS-dev-amd64.iso.sha256
            ${{ runner.temp }}/mjon-live/mjon-build.json
            ${{ runner.temp }}/mjon-live/boot-records.txt
            ${{ runner.temp }}/mjon-live/boot-bios-serial.txt
            ${{ runner.temp }}/mjon-live/boot-uefi-serial.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Keep build diagnostics if construction fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mjon-ai-os-iso-build-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mjon-live/mjon-build.log
            ${{ runner.temp }}/mjon-live/mjon-build.json
            ${{ runner.temp }}/mjon-live/boot-bios-serial.txt
            ${{ runner.temp }}/mjon-live/boot-uefi-serial.txt
          if-no-files-found: ignore
          retention-days: 7

  publish-usb-prerelease:
    name: Publish SHA256-verified Live USB candidate
    needs: live-iso
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(os):') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download the fully verified ISO from the preceding job
        uses: actions/download-artifact@v4
        with:
          name: mjon-ai-os-developer-iso-${{ github.sha }}
          path: ${{ runner.temp }}/verified-iso
      - name: Verify checksum, boot sectors and actual virtual boots
        run: |
          python -m unittest discover -s mjon_os/tests -p 'test_release_checks.py' -v
          iso="$RUNNER_TEMP/verified-iso/MJON-AI-OS-dev-amd64.iso"
          python -m mjon_os.release_checks \
            --iso "$iso" \
            --checksum "$iso.sha256" \
            --boot-records "$RUNNER_TEMP/verified-iso/boot-records.txt" \
            --bios-log "$RUNNER_TEMP/verified-iso/boot-bios-serial.txt" \
            --uefi-log "$RUNNER_TEMP/verified-iso/boot-uefi-serial.txt"
      - name: Publish experimental USB pre-release (not a Windows installer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verified-iso"
          tag="mjon-ai-os-usb-dev-${GITHUB_SHA:0:12}"
          gh release create "$tag" \
            MJON-AI-OS-dev-amd64.iso \
            MJON-AI-OS-dev-amd64.iso.sha256 \
            mjon-build.json \
            boot-records.txt \
            boot-bios-serial.txt \
            boot-uefi-serial.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MJON AI OS - USB Live experimental (source ${GITHUB_SHA:0:12})" \
            --notes-file "$GITHUB_WORKSPACE/mjon_os/USB_RELEASE_NOTES.md" \
            --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'

