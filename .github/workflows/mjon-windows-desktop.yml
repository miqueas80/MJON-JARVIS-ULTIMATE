name: MJON Windows desktop native executable

on:
  push:
    branches: [feature/mjon-windows-migration]
    paths:
      - 'mjon_windows/desktop_host.py'
      - 'mjon_windows/web/**'
      - 'mjon_windows/tests/test_desktop_host.py'
      - 'mjon_windows/tests/test_desktop_distribution.py'
      - 'packaging/windows/CREAR_ISO_MJON_ESCRITORIO.cmd'
      - 'packaging/windows/INSTALAR-MJON.cmd'
      - 'packaging/windows/DESINSTALAR-MJON.cmd'
      - 'packaging/windows/mjon_desktop_entry.py'
      - '.github/workflows/mjon-windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Test and package native MJON AI OS desktop
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated Windows branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install standalone desktop runtime
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6.16,<7" "pywebview>=5.0,<7"
      - name: Test loopback server and original Windows backend
        run: python -m unittest mjon_windows.tests.test_desktop_host mjon_windows.tests.test_desktop_distribution mjon_windows.tests.test_backend -v
      - name: Validate local JS without external runtime
        shell: pwsh
        run: |
          node --check mjon_windows/web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'MJON static script failed parsing' }
      - name: Frozen native Windows UI with bundled offline assets
        run: python -m PyInstaller --windowed --onefile --clean --noconfirm --name MJON-AI-OS --paths . --collect-all webview --add-data "mjon_windows/web;mjon_windows/web" packaging/windows/mjon_desktop_entry.py
      - name: Check EXE was created and run real loopback HTTP smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\MJON-AI-OS.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Desktop executable missing' }
          if ((Get-Item -LiteralPath $exe).Length -lt 1000000) { throw 'Desktop executable unexpectedly small' }
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Frozen UI loopback self-test failed: $($process.ExitCode)" }
          Write-Output 'MJON_DESKTOP_FROZEN_HTTP_OK'
      - name: Check one-click offline ISO builder syntax
        shell: pwsh
        run: |
          & cmd.exe /d /c packaging\\windows\\CREAR_ISO_MJON_ESCRITORIO.cmd --self-test
          if ($LASTEXITCODE -ne 0) { throw 'MJON ISO builder self-test failed' }
      - name: Create SHA256 and release scope notes
        shell: pwsh
        run: |
          $sha = (Get-FileHash 'dist\MJON-AI-OS.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  MJON-AI-OS.exe" | Set-Content 'dist\SHA256-DESKTOP.txt' -Encoding ascii
          @'
          MJON AI OS Windows Desktop Preview
          ==================================
          Native WebView2 GUI, loopback HTTP bridge, real installed module
          inventory, local Ollama chat on explicit user click, Windows
          settings allowlist. Offline-first; no automatic cloud API.
          This standalone EXE is not a bootable OS or completed Windows ISO.
          Windows WebView2 Runtime may be required on some Windows builds.
          No AI models are bundled. No autostart, installation or UAC bypass.
          Keep the originally approved visual navigation and aesthetic locked.
          Unsigned preview executable: verify SHA256 before opening.
          '@ | Set-Content 'dist\LEEME-WINDOWS-DESKTOP.txt' -Encoding UTF8
      - name: Bundle consent-based installer and ISO integration builder
        shell: pwsh
        run: |
          Copy-Item packaging/windows/INSTALAR-MJON.cmd dist/
          Copy-Item packaging/windows/DESINSTALAR-MJON.cmd dist/
          Copy-Item packaging/windows/CREAR_ISO_MJON_ESCRITORIO.cmd dist/
          foreach ($part in @('INSTALAR-MJON.cmd','DESINSTALAR-MJON.cmd','CREAR_ISO_MJON_ESCRITORIO.cmd')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'dist' $part))) { throw "Missing $part" }
          }
      - name: Upload standalone Windows application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MJON-AI-OS-Windows-Desktop-Preview
          path: |
            dist/MJON-AI-OS.exe
            dist/SHA256-DESKTOP.txt
            dist/LEEME-WINDOWS-DESKTOP.txt
            dist/INSTALAR-MJON.cmd
            dist/DESINSTALAR-MJON.cmd
            dist/CREAR_ISO_MJON_ESCRITORIO.cmd
          if-no-files-found: error
          retention-days: 30
