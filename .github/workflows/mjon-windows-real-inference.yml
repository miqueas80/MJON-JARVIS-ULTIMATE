name: MJON Windows real local inference canary

on:
  push:
    branches: [feature/mjon-windows-migration]
    paths:
      - '.github/workflows/mjon-windows-real-inference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-real-generation:
    name: Real Ollama + tiny local model on Windows CPU
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch without LFS models
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Download official pinned standalone Ollama and verify SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'ollama-windows-amd64.zip'
          $url = 'https://github.com/ollama/ollama/releases/download/v0.40.14/ollama-windows-amd64.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '65d68cade6cf6375f398b518224f8c8a15e062387f38cf477abfc848de7e7e29'
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Ollama archive SHA256 mismatch" }
          $directory = Join-Path $env:RUNNER_TEMP 'mjon-ollama'
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $exe = Get-ChildItem -Path $directory -Recurse -Filter 'ollama.exe' -File | Select-Object -First 1
          if (-not $exe) { throw "Ollama executable missing from archive" }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "OLLAMA_MODELS=$($env:RUNNER_TEMP)\mjon-models" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OLLAMA_HOST=127.0.0.1:11434" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'Pinned Ollama standalone extracted and checksum verified'
      - name: Start Ollama, download weights, and prove real local generation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Path $env:OLLAMA_MODELS -ItemType Directory -Force | Out-Null
          $bin = (Get-Command ollama.exe).Source
          $outLog = Join-Path $env:RUNNER_TEMP 'ollama-server-out.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'ollama-server-err.log'
          $proc = Start-Process -FilePath $bin -ArgumentList 'serve' -PassThru -WindowStyle Hidden -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            if ($proc.HasExited) { throw "Local Ollama server stopped early; exit code $($proc.ExitCode)" }
            try {
              $response = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/version' -TimeoutSec 2
              if ($response.version) { $ready = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { throw "Local-only Ollama server did not start" }
          & $bin pull 'smollm2:135m'
          if ($LASTEXITCODE -ne 0) { throw "Failed to pull local model" }
          Write-Output 'Ollama is running and tiny local model weights are present'
          # Keep Ollama and the real generation in the SAME Actions step.
          # The Windows hosted runner can terminate spawned child processes
          # at step boundaries even when the previous step successfully pulled.
          $env:OLLAMA_HOST='127.0.0.1:11434'
          @'
          from mjon_jarvis.system_status import read_status
          from mjon_windows.backend import local_chat
          from mjon_os.local_inference import OllamaClient
          status = read_status()
          assert status.memory_total_bytes is not None and status.memory_total_bytes > 0
          client = OllamaClient(ram_bytes=status.memory_total_bytes)
          assert "smollm2:135m" in client.models()
          answer = local_chat(
              "Respondé brevemente con un saludo en español.",
              model="smollm2:135m",
              ram_bytes=status.memory_total_bytes,
          )
          assert isinstance(answer, str) and answer.strip(), "Model did not generate real text"
          print("REAL_LOCAL_GENERATION_OK", len(answer), "chars")
          print("MODEL", "smollm2:135m", "RAM", status.memory_total_bytes)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Real local model generation failed" }
